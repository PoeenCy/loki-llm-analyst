server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: apache_access_log
    static_configs:
      - targets:
          - localhost
        labels:
          job: apache
          host: seminar-server
          __path__: /var/log/apache/*.log

    pipeline_stages:
      # Parse Apache Access Log (Combined Log Format)
      # 83.149.9.216 - - [17/May/2015:10:05:03 +0000] "GET /presentations/... HTTP/1.1" 200 203023
      - regex:
          expression: '^(?P<client_ip>\S+) \S+ \S+ \[(?P<timestamp>[^\]]+)\]'
      - regex:
          expression: '\] "(?P<method>\S+) (?P<path>\S+) [^"]*" (?P<status>\d{3})'

      # Use the timestamp from the log line instead of ingestion time
      - timestamp:
          source: timestamp
          format: "02/Jan/2006:15:04:05 -0700"

      # Set labels in Loki (low cardinality only: status and method)
      - labels:
          method:
          status:
